name: Android Build CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2

      - name: Verify Flutter installation
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Universal Release APK
        run: flutter build apk --release
        env:
          FLUTTER_BUILD_NAME: 1.0.0
          FLUTTER_BUILD_NUMBER: ${{ github.run_number }}

      - name: List APK outputs
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Generate checksums
        id: checksums
        run: |
          cd build/app/outputs/flutter-apk
          echo 'CHECKSUMS<<EOF' >> $GITHUB_OUTPUT
          sha256sum *.apk >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release (main branch only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" \
            --title "FFM Build #${{ github.run_number }}" \
            --notes "## Financial Freedom Management
            Download the APK below and install on your Android device.
            This APK uses a committed release keystore with v1+v2+v3 signing for Android 8+ compatibility." \
            build/app/outputs/flutter-apk/app-release.apk || echo "Release may already exist"
