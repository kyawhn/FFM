name: Android Build CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2

      - name: Verify Flutter installation
        run: flutter --version

      - name: Generate release keystore
        run: |
          cd android
          keytool -genkey -v -keystore release.keystore -alias ffmkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ffmpass -keypass ffmpass \
            -dname "CN=FFM,OU=FFM,O=FFM,L=Unknown,ST=Unknown,C=US"
          echo "storeFile=release.keystore" > key.properties
          echo "keyAlias=ffmkey" >> key.properties
          echo "storePassword=ffmpass" >> key.properties
          echo "keyPassword=ffmpass" >> key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release
        env:
          FLUTTER_BUILD_NAME: 1.0.0
          FLUTTER_BUILD_NUMBER: ${{ github.run_number }}

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
