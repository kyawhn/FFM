name: Android Build CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2

      - name: Verify Flutter installation
        run: flutter --version

      - name: Generate release keystore
        run: |
          cd android
          keytool -genkey -v -keystore release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=FFM,OU=FFM,O=FFM,L=Unknown,ST=Unknown,C=US"
          echo "storeFile=release.keystore" > key.properties
          echo "keyAlias=release" >> key.properties
          echo "storePassword=android" >> key.properties
          echo "keyPassword=android" >> key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK (split per ABI)
        run: flutter build apk --release --split-per-abi
        env:
          FLUTTER_BUILD_NAME: 1.0.0
          FLUTTER_BUILD_NUMBER: ${{ github.run_number }}

      - name: List APK outputs
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Verify APK signature
        run: |
          apt-get update -qq && apt-get install -y -qq apksigner 2>/dev/null || true
          apksigner verify --verbose build/app/outputs/flutter-apk/app-debug.apk 2>&1 | head -10 || echo "apksigner not available, trying keytool"
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-debug.apk 2>&1 | head -5 || echo "keytool check failed"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload Release APK (arm64)
        uses: actions/upload-artifact@v7
        with:
          name: app-release-arm64-v8a.apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Upload Release APK (armeabi)
        uses: actions/upload-artifact@v7
        with:
          name: app-release-armeabi-v7a.apk
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30

      - name: Upload Release APK (x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: app-release-x86_64.apk
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30
