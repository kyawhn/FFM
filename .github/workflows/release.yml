name: Tagged Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release
        env:
          FLUTTER_BUILD_NAME: ${{ github.ref_name }}
          FLUTTER_BUILD_NUMBER: ${{ github.run_number }}

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Financial Freedom Management ${{ github.ref_name }}" \
            --notes "## Financial Freedom Management ${{ github.ref_name }}
            Download the APK and install on your Android device." \
            --generate-notes \
            build/app/outputs/flutter-apk/app-release.apk
