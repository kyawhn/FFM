pluginManagement {
    def flutterSdkPath = System.getenv('FLUTTER_SDK_PATH') ?: '/opt/flutter'
    def flutterSdkDir = file(flutterSdkPath)
    if (!flutterSdkDir.exists()) {
        throw new GradleException("Flutter SDK not found. Define location with FLUTTER_SDK_PATH env variable.")
    }

    includeBuild("${flutterSdkDir}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.7.0" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
}

include ":app"
